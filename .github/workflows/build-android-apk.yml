name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Prepare and sync Android project
        run: npm run android:prepare
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IXORA-Studio-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PIXORA-Studio-v2.0.0.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          target_commitish: ${{ github.sha }}
          name: PIXORA Studio v2.0.0
          body: PIXORA Studio v2.0.0 - Android debug APK built by GitHub Actions.
          files: PIXORA-Studio-v2.0.0.apk
